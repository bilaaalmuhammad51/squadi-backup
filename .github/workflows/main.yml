name: Squadi Mobile Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from
        required: true
        default: develop
      platform:
        description: Select mobile platform to run tests on, android or ios
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - other
      app:
        description: "App to test"
        required: true
        default: "Squadi"
        type: choice
        options:
          - Squadi
          - NetballConnect
          - football
      environment:
        description: "Environment"
        required: true
        default: "Dev"
        type: choice
        options:
          - Dev
          - Staging
          - Production
      spec_path:
        description: "Path to a specific spec file (e.g., tests/specs/login/test_login.ts). Leave default to run only login test, or set to tests/specs/**/*.ts for all specs."
        required: false
        default: "tests/specs/login/test_validate_successful_login_flow.ts"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: ${{ github.event.inputs.app }} on ${{ github.event.inputs.platform }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest

    env:
      PLATFORM: ${{ github.event.inputs.platform }}
      APP: ${{ github.event.inputs.app }}
      ENV: browserstack
      TEST_ENV: ${{ github.event.inputs.environment }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SPEC_PATH: ${{ github.event.inputs.spec_path }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Validate required secrets
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ]; then
            echo "Missing BROWSERSTACK_USERNAME secret"
            exit 1
          fi

          if [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "Missing BROWSERSTACK_ACCESS_KEY secret"
            exit 1
          fi

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Missing SLACK_WEBHOOK_URL secret"
            exit 1
          fi

      - name: Get commit short SHA
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean old reports
        run: rm -rf allure-results allure-report

      - name: Run WDIO login test on BrowserStack
        id: run_tests
        continue-on-error: true
        run: |
          APP="$APP" PLATFORM="$PLATFORM" ENV="$ENV" TEST_ENV="$TEST_ENV" ./node_modules/.bin/wdio run ./wdio.conf.ts --spec "$SPEC_PATH"

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npx --no-install allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            cat > allure-report/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head><title>No Allure Results</title></head>
            <body>
              <h1>No Allure results generated</h1>
              <p>WDIO failed before creating allure-results.</p>
              <p>App: ${{ steps.app_meta.outputs.display_name }}</p>
              <p>Platform: ${{ env.PLATFORM }}</p>
              <p>Environment: ${{ env.TEST_ENV }}</p>
            </body>
          </html>
          EOF
          fi

      - name: Generate test summary
        if: always()
        id: summary
        run: |
          node <<'EOF'
          const fs = require("fs");

          const summaryPath = "allure-report/widgets/summary.json";

          let total = 0;
          let passed = 0;
          let failed = 0;
          let broken = 0;
          let flaky = 0;
          let skipped = 0;
          let unknown = 0;
          let duration = "0s";

          if (fs.existsSync(summaryPath)) {
            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const stat = summary.statistic || {};

            total = stat.total || 0;
            passed = stat.passed || 0;
            failed = stat.failed || 0;
            broken = stat.broken || 0;
            flaky = stat.flaky || 0;
            skipped = stat.skipped || 0;
            unknown = stat.unknown || 0;

            const ms = summary.time?.duration || 0;
            const seconds = Math.round(ms / 1000);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;

            duration = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `total=${total}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `broken=${broken}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `flaky=${flaky}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skipped=${skipped}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `unknown=${unknown}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `duration=${duration}\n`);
          EOF
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Upload Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report
          retention-days: 14

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Slack report
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Squadi Mobile Test Result",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📱 Squadi Mobile Test Result"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.run_tests.outcome == 'success' && '🟢 *PASSED*' || '🔴 *FAILED*' }}"
                  }
                },
                {
                  "type": "divider"
                },
            {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*📦 App*\n${{ env.APP }}" },
                    { "type": "mrkdwn", "text": "*🌎 Environment*\n${{ env.TEST_ENV }}" },
                    { "type": "mrkdwn", "text": "*📱 Platform*\n${{ env.PLATFORM }}" },
                    { "type": "mrkdwn", "text": "*🌿 Branch*\n`${{ github.event.inputs.branch }}`" }
                  ]
                },
                { "type": "divider" },
                 {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Test Summary*" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*🧪 Total*\n${{ steps.summary.outputs.total }}" },
                    { "type": "mrkdwn", "text": "*⏱ Duration*\n${{ steps.summary.outputs.duration }}" },
                    { "type": "mrkdwn", "text": "*✅ Passed*\n${{ steps.summary.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*❌ Failed*\n${{ steps.summary.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*⏭ Skipped*\n${{ steps.summary.outputs.skipped }}" },
                    { "type": "mrkdwn", "text": "*⚠️ Flaky*\n${{ steps.summary.outputs.flaky }}" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "☁️ Execution: *BrowserStack*  ·  🔑 Commit: `${{ steps.commit.outputs.short_sha }}`"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "📊 View Allure Report" },
                      "style": "primary",
                      "url": "${{ steps.deployment.outputs.page_url }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🧾 Open GitHub Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🌐 BrowserStack Session" },
                      "url": "https://app-automate.browserstack.com/dashboard/v2"
                    }
                  ]
                }
              ]
            }

      - name: Mark workflow failed if tests failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1

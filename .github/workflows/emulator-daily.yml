name: Daily Android Emulator Tests

# Tier 1 of the Asma plan:
# Fast, frequent regression on an Android emulator running entirely on the
# GitHub Actions runner (local Appium server + UiAutomator2). No BrowserStack
# minutes are consumed here - runner minutes only.
#
# The suite runs SHARDED in two phases:
#   prepare            - plans the shard matrix
#   emulator-test      - N parallel shards, PARALLEL-SAFE specs only
#   emulator-exclusive - one serialised job for the specs that rewrite the
#                        shared competition record (see below)
#   report             - merges every shard's results into one report + Slack
#
# Device state is isolated by construction: each shard is a separate runner
# with its own emulator, Appium server and app install. Match data is isolated
# too - every mutating spec creates its own match via
# MatchApiHelper.createMatch().
#
# What is NOT isolated is competition 239. MatchApiHelper.updateCompetitionSettings
# PUTs that whole record, and the entire suite reads it, so a spec that flips
# gameTimeTrackingEnabled or lockAttendanceMinutes breaks every team-sheet and
# team-officials spec running at that moment - then resets to defaults and
# breaks them again. Measured: sequential run #95 was 103 passed / 5 failed;
# the first naive 6-way parallel run (#70) was 82 passed / 23 failed + 3
# broken, and the extra failures were overwhelmingly readers of that record.
# Hence the second phase: scripts/shard-specs.js derives which specs write
# competition settings and keeps them out of the parallel phase entirely.

on:
  schedule:
    # 02:00 PKT daily (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from
        required: true
        default: develop
      api_level:
        description: Android API level for the emulator
        required: true
        default: "34"
      spec_path:
        description: "Spec glob to run (default: all specs)"
        required: false
        default: "tests/specs/**/*.ts"
      shard_total:
        description: "Parallel emulators for phase 1 (8 is the sweet spot; past ~10 the serialised exclusive phase dominates)"
        required: false
        default: "8"

permissions:
  contents: write # push the report to the gh-pages branch
  actions: read

# Shared with the BrowserStack workflow so only one publish runs at a time
# (prevents concurrent pushes racing on the gh-pages branch). Only the `report`
# job publishes, so the shards themselves are never serialised by this.
concurrency:
  group: pages-site-publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Work out how many shards to start and hand the matrix the list of indexes.
  # ---------------------------------------------------------------------------
  prepare:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      spec_count: ${{ steps.plan.outputs.spec_count }}
      exclusive_count: ${{ steps.plan.outputs.exclusive_count }}
      expected_artifacts: ${{ steps.plan.outputs.expected_artifacts }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Plan the shard matrix
        id: plan
        env:
          SPEC_PATH: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}
          REQUESTED_SHARDS: ${{ github.event.inputs.shard_total || '8' }}
        run: |
          # Parallel-safe specs (phase 1) and competition-settings specs
          # (phase 2) are counted separately - only the former get sharded.
          spec_count="$(SHARD_MODE=parallel node scripts/shard-specs.js --count)"
          exclusive_count="$(SHARD_MODE=exclusive node scripts/shard-specs.js --count)"
          requested="$REQUESTED_SHARDS"

          # Clamp to [1, spec_count]. More shards than specs would boot
          # emulators with nothing to run - pure wasted runner minutes.
          if ! [ "$requested" -ge 1 ] 2>/dev/null; then requested=1; fi
          if [ "$requested" -gt "$spec_count" ]; then requested="$spec_count"; fi

          shards="$(seq 1 "$requested" | jq -R . | jq -sc .)"

          # One artifact per parallel shard, plus one from the exclusive phase
          # when it has anything to run. The report job checks against this so
          # a shard whose runner died cannot be mistaken for a pass.
          expected=$requested
          if [ "$exclusive_count" -gt 0 ]; then expected=$((expected + 1)); fi

          echo "Parallel-safe: $spec_count spec(s) across $requested shard(s): $shards"
          echo "Exclusive (rewrite competition settings): $exclusive_count spec(s)"
          echo "Expecting $expected result artifact(s)"
          echo
          SHARD_TOTAL="$requested" node scripts/shard-specs.js --plan

          {
            echo "spec_count=$spec_count"
            echo "exclusive_count=$exclusive_count"
            echo "shard_total=$requested"
            echo "shards=$shards"
            echo "expected_artifacts=$expected"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Phase 1: the parallel-safe specs, N emulators at once, duration-balanced.
  # ---------------------------------------------------------------------------
  emulator-test:
    name: Parallel
    needs: prepare
    strategy:
      # Never cancel the other shards because one of them failed - we want the
      # full picture in the merged report, not a partial one.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    uses: ./.github/workflows/emulator-shard.yml
    with:
      shard-name: ${{ matrix.shard }}
      shard-index: ${{ matrix.shard }}
      shard-total: ${{ needs.prepare.outputs.shard_total }}
      shard-mode: parallel
      spec-path: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}
      api-level: ${{ github.event.inputs.api_level || '34' }}
      ref: ${{ github.event.inputs.branch || github.ref_name }}

  # ---------------------------------------------------------------------------
  # Phase 2: the specs that rewrite competition 239, one at a time, alone.
  #
  # `needs: emulator-test` is the whole point - this phase must not overlap the
  # parallel phase, or it corrupts it. It still runs when a parallel shard
  # failed (we want complete results), but not if `prepare` never produced a
  # plan.
  # ---------------------------------------------------------------------------
  emulator-exclusive:
    name: Exclusive
    needs: [prepare, emulator-test]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.exclusive_count != '0' }}
    uses: ./.github/workflows/emulator-shard.yml
    with:
      shard-name: exclusive
      shard-mode: exclusive
      spec-path: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}
      api-level: ${{ github.event.inputs.api_level || '34' }}
      ref: ${{ github.event.inputs.branch || github.ref_name }}

  # ---------------------------------------------------------------------------
  # Merge every shard's results into one report, publish it, notify Slack once.
  # ---------------------------------------------------------------------------
  report:
    name: Merge results and publish report
    needs: [prepare, emulator-test, emulator-exclusive]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Get commit short SHA
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download every shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: shard-artifacts

      # Allure result files are uniquely named (uuid-result.json etc.), so the
      # shards' results merge by simply being copied into one directory - there
      # is nothing to reconcile and no chance of one shard overwriting another.
      - name: Merge shard results
        id: merge
        run: |
          rm -rf allure-results allure-report
          mkdir -p allure-results

          shopt -s nullglob
          shard_dirs=(shard-artifacts/allure-results-shard-*)
          echo "Found ${#shard_dirs[@]} shard artifact(s)"

          worst=0
          missing=0
          for dir in "${shard_dirs[@]}"; do
            name="$(basename "$dir")"

            if [ -d "$dir/allure-results" ]; then
              count=$(find "$dir/allure-results" -type f | wc -l)
              echo "  $name -> $count result file(s)"
              cp -r "$dir/allure-results/." allure-results/
            else
              echo "  $name -> NO allure-results (shard produced nothing)"
              missing=$((missing + 1))
            fi

            # Trust each shard's real WDIO exit code, not the emulator-runner
            # step outcome - that step exits non-zero because we hard-kill the
            # emulator, even when the tests passed.
            code="$(cat "$dir/wdio-exit-code.txt" 2>/dev/null || echo 1)"
            echo "     exit code: $code"
            [ "$code" = "0" ] || worst=1
          done

          # A shard that never wrote an exit code at all (runner died, job
          # cancelled, timeout) must not be silently reported as a pass.
          # Empty when `prepare` itself failed - then there is nothing to
          # compare against and the missing artifacts already fail the run.
          expected="${{ needs.prepare.outputs.expected_artifacts }}"
          expected="${expected:-0}"
          if [ "${#shard_dirs[@]}" -ne "$expected" ]; then
            echo "Expected $expected shard artifact(s), got ${#shard_dirs[@]} - marking the run failed"
            worst=1
          fi
          [ "$missing" -eq 0 ] || worst=1

          echo "exit_code=$worst" >> "$GITHUB_OUTPUT"
          echo "Merged $(find allure-results -type f | wc -l) result file(s); overall exit code $worst"

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            npx --no-install allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<h1>No Allure results generated</h1>" > allure-report/index.html
          fi

      - name: Generate test summary
        if: always()
        id: summary
        run: |
          node <<'EOF'
          const fs = require("fs");
          const summaryPath = "allure-report/widgets/summary.json";
          let stat = {}, ms = 0;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            stat = s.statistic || {};
            ms = s.time?.duration || 0;
          }
          const sec = Math.round(ms / 1000);
          const dur = sec >= 60 ? `${Math.floor(sec/60)}m ${sec%60}s` : `${sec}s`;
          const out = process.env.GITHUB_OUTPUT;
          // Count "broken" (tests that errored) as failed so the reported
          // numbers match reality - a broken test is not a pass.
          const failed = (stat.failed || 0) + (stat.broken || 0);
          fs.appendFileSync(out, `total=${stat.total || 0}\n`);
          fs.appendFileSync(out, `passed=${stat.passed || 0}\n`);
          fs.appendFileSync(out, `failed=${failed}\n`);
          fs.appendFileSync(out, `broken=${stat.broken || 0}\n`);
          fs.appendFileSync(out, `flaky=${stat.flaky || 0}\n`);
          fs.appendFileSync(out, `skipped=${stat.skipped || 0}\n`);
          fs.appendFileSync(out, `duration=${dur}\n`);
          EOF

      - name: Determine test result
        if: always()
        id: result
        run: |
          code="${{ steps.merge.outputs.exit_code }}"
          code="${code:-1}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # Restore the previously published site from the gh-pages BRANCH (git
      # storage) so per-run history is preserved. This does not touch the
      # Actions artifact storage quota. If the branch does not exist yet, this
      # is a no-op and the site starts fresh.
      - name: Checkout existing gh-pages content
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev

      - name: Assemble Pages site (per-run report + 3-day history)
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RETENTION_DAYS: "3"
          PREV_SITE_DIR: gh-pages-prev
        run: bash scripts/assemble-allure-site.sh

      # Publish to the gh-pages branch. Because this commits to a git branch
      # (not an Actions artifact), it succeeds even when the Actions artifact
      # storage quota is full - which is exactly what was breaking the report.
      # The Pages URL is unchanged as long as the repo's Pages source is set to
      # "Deploy from a branch -> gh-pages / (root)".
      - name: Publish report to gh-pages branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # force_orphan keeps gh-pages at a SINGLE commit every run. Without
          # it the branch's git history would grow without bound (a slow-motion
          # repeat of the storage problem) even though old report files are
          # pruned. The assemble step already restored prior reports into
          # _site, so replacing the whole branch loses no history.
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Publish emulator report for run #${{ github.run_number }}"

      - name: Send Slack report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Squadi Daily Emulator Test Result",
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "📱 Squadi Daily Emulator (Android)" } },
                { "type": "section", "text": { "type": "mrkdwn", "text": "${{ steps.result.outputs.outcome == 'success' && '🟢 *PASSED*' || '🔴 *FAILED*' }}" } },
                { "type": "divider" },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*🧪 Total*\n${{ steps.summary.outputs.total }}" },
                    { "type": "mrkdwn", "text": "*⏱ Duration*\n${{ steps.summary.outputs.duration }}" },
                    { "type": "mrkdwn", "text": "*✅ Passed*\n${{ steps.summary.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*❌ Failed*\n${{ steps.summary.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*⏭ Skipped*\n${{ steps.summary.outputs.skipped }}" },
                    { "type": "mrkdwn", "text": "*⚠️ Flaky*\n${{ steps.summary.outputs.flaky }}" }
                  ]
                },
                { "type": "divider" },
                { "type": "context", "elements": [ { "type": "mrkdwn", "text": "💻 Execution: *GitHub Actions emulator (local Appium)*  ·  ⚡ Parallel shards: *${{ needs.prepare.outputs.shard_total }}*  ·  🔑 Commit: `${{ steps.commit.outputs.short_sha }}`" } ] },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "📊 Allure Report" }, "style": "primary", "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/emulator/${{ github.run_number }}/" },
                    { "type": "button", "text": { "type": "plain_text", "text": "🧾 GitHub Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }

      - name: Mark workflow failed if tests failed
        if: steps.result.outputs.outcome != 'success'
        run: exit 1

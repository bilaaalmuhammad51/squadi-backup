name: Daily Android Emulator Tests

# Tier 1 of the Asma plan:
# Fast, frequent regression on an Android emulator running entirely on the
# GitHub Actions runner (local Appium server + UiAutomator2). No BrowserStack
# minutes are consumed here - runner minutes only.

on:
  schedule:
    # 02:00 PKT daily (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from
        required: true
        default: develop
      api_level:
        description: Android API level for the emulator
        required: true
        default: "34"
      spec_path:
        description: "Spec glob to run (default: all specs)"
        required: false
        default: "tests/specs/**/*.ts"

permissions:
  contents: write # push the report to the gh-pages branch
  actions: read

# Shared with the BrowserStack workflow so only one publish runs at a time
# (prevents concurrent pushes racing on the gh-pages branch).
concurrency:
  group: pages-site-publish
  cancel-in-progress: false

jobs:
  emulator-test:
    name: Android Emulator (local)
    runs-on: ubuntu-latest
    # Safety net against a true runaway only - the emulator is force-killed
    # after tests so the job ends promptly on its own. A bit above the step cap
    # to leave room for report/Slack/deploy after the test window.
    timeout-minutes: 250

    env:
      PLATFORM: android
      ENV: local
      APP: Squadi
      TEST_ENV: Dev
      API_LEVEL: ${{ github.event.inputs.api_level || '34' }}
      SPEC_PATH: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Get commit short SHA
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Appium UiAutomator2 driver
        # Pin to the 3.x line: driver v4+ requires Appium 3, but this project
        # uses Appium 2 (see package.json). 3.x is the Appium-2-compatible line.
        run: npx appium driver install uiautomator2@3.10.0

      - name: Setup Java (Allure + Android tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The hosted runner ships with ~6.9 GB free, but the pixel_6 profile asks
      # for a 7372.80 MB userdata partition, so the emulator dies at launch with
      # "Not enough space to create userdata partition" and every later adb poll
      # fails until the boot timeout. Dropping the preinstalled toolchains we
      # never use buys back well over 20 GB. df is printed so the margin is
      # visible in the log if this ever gets tight again.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Download test APK
        env:
          # The test APK is stored as an asset on a GitHub Release in this
          # repo (tag below). GITHUB_TOKEN can read it directly - no external
          # service, virus-scan page, or quota to fight with.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_RELEASE_TAG: ${{ vars.APK_RELEASE_TAG || 'test-apk' }}
        run: |
          mkdir -p tests/apps
          gh release download "$APK_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern squadi-dev.apk \
            --dir tests/apps \
            --clobber
          echo "Downloaded APK:"
          ls -la tests/apps/squadi-dev.apk
          # Fail early if we somehow got something that isn't an APK
          if ! file tests/apps/squadi-dev.apk | grep -qiE 'archive|android|zip'; then
            echo "Downloaded file does not look like an APK:"
            file tests/apps/squadi-dev.apk
            head -c 200 tests/apps/squadi-dev.apk
            exit 1
          fi

      - name: Clean old reports
        run: rm -rf allure-results allure-report

      - name: Run tests on Android emulator
        id: run_tests
        continue-on-error: true
        # Step cap big enough for a full suite (~57 tests run sequentially at
        # ~2.3 min each, plus emulator boot - roughly 140 min). The teardown
        # hang is handled by force-killing the emulator at the end of the
        # script, so this is only a runaway guard - normal runs end well
        # before it.
        timeout-minutes: 240
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          # pixel_6 otherwise defaults to a 7.2 GB userdata partition, which is
          # more than the runner has free. 6 GB is ample for the app plus its
          # data and keeps the AVD under the limit on every runner pool.
          disk-size: 6144M
          # More RAM/cores so the launcher doesn't ANR ("Pixel Launcher isn't
          # responding") under load. -no-snapshot-save avoids a slow snapshot
          # write that can hang teardown.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2
          disable-animations: true
          # The runner executes each line of an inline script as a separate
          # shell, so the full sequence lives in one file instead.
          script: bash scripts/run-emulator-tests.sh

      - name: Upload Appium log
        if: always()
        # Non-fatal: if the Actions artifact storage quota is full this upload
        # fails, but it must not fail the run - the report is published to the
        # gh-pages branch (git storage), which does not use artifact storage.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-${{ github.run_number }}
          path: appium.log
          if-no-files-found: ignore
          # Debug aid only - keep it short so old logs don't accumulate against
          # the shared Actions storage quota (default retention is 90 days).
          retention-days: 3

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npx --no-install allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<h1>No Allure results generated</h1>" > allure-report/index.html
          fi

      - name: Generate test summary
        if: always()
        id: summary
        run: |
          node <<'EOF'
          const fs = require("fs");
          const summaryPath = "allure-report/widgets/summary.json";
          let stat = {}, ms = 0;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            stat = s.statistic || {};
            ms = s.time?.duration || 0;
          }
          const sec = Math.round(ms / 1000);
          const dur = sec >= 60 ? `${Math.floor(sec/60)}m ${sec%60}s` : `${sec}s`;
          const out = process.env.GITHUB_OUTPUT;
          // Count "broken" (tests that errored) as failed so the reported
          // numbers match reality - a broken test is not a pass.
          const failed = (stat.failed || 0) + (stat.broken || 0);
          fs.appendFileSync(out, `total=${stat.total || 0}\n`);
          fs.appendFileSync(out, `passed=${stat.passed || 0}\n`);
          fs.appendFileSync(out, `failed=${failed}\n`);
          fs.appendFileSync(out, `broken=${stat.broken || 0}\n`);
          fs.appendFileSync(out, `flaky=${stat.flaky || 0}\n`);
          fs.appendFileSync(out, `skipped=${stat.skipped || 0}\n`);
          fs.appendFileSync(out, `duration=${dur}\n`);
          EOF

      - name: Determine test result
        # Decide pass/fail from the real WDIO exit code (written by the test
        # script), NOT from the emulator-runner step outcome - that step exits
        # non-zero because we hard-kill the emulator, even when tests passed.
        if: always()
        id: result
        run: |
          code=$(cat wdio-exit-code.txt 2>/dev/null || echo "1")
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # Restore the previously published site from the gh-pages BRANCH (git
      # storage) so per-run history is preserved. This does not touch the
      # Actions artifact storage quota. If the branch does not exist yet, this
      # is a no-op and the site starts fresh.
      - name: Checkout existing gh-pages content
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev

      - name: Assemble Pages site (per-run report + 3-day history)
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RETENTION_DAYS: "3"
          PREV_SITE_DIR: gh-pages-prev
        run: bash scripts/assemble-allure-site.sh

      # Publish to the gh-pages branch. Because this commits to a git branch
      # (not an Actions artifact), it succeeds even when the Actions artifact
      # storage quota is full - which is exactly what was breaking the report.
      # The Pages URL is unchanged as long as the repo's Pages source is set to
      # "Deploy from a branch -> gh-pages / (root)".
      - name: Publish report to gh-pages branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # force_orphan keeps gh-pages at a SINGLE commit every run. Without
          # it the branch's git history would grow without bound (a slow-motion
          # repeat of the storage problem) even though old report files are
          # pruned. The assemble step already restored prior reports into
          # _site, so replacing the whole branch loses no history.
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Publish emulator report for run #${{ github.run_number }}"

      - name: Send Slack report
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Squadi Daily Emulator Test Result",
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "📱 Squadi Daily Emulator (Android)" } },
                { "type": "section", "text": { "type": "mrkdwn", "text": "${{ steps.result.outputs.outcome == 'success' && '🟢 *PASSED*' || '🔴 *FAILED*' }}" } },
                { "type": "divider" },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*🧪 Total*\n${{ steps.summary.outputs.total }}" },
                    { "type": "mrkdwn", "text": "*⏱ Duration*\n${{ steps.summary.outputs.duration }}" },
                    { "type": "mrkdwn", "text": "*✅ Passed*\n${{ steps.summary.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*❌ Failed*\n${{ steps.summary.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*⏭ Skipped*\n${{ steps.summary.outputs.skipped }}" },
                    { "type": "mrkdwn", "text": "*⚠️ Flaky*\n${{ steps.summary.outputs.flaky }}" }
                  ]
                },
                { "type": "divider" },
                { "type": "context", "elements": [ { "type": "mrkdwn", "text": "💻 Execution: *GitHub Actions emulator (local Appium)*  ·  🔑 Commit: `${{ steps.commit.outputs.short_sha }}`" } ] },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "📊 Allure Report" }, "style": "primary", "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/emulator/${{ github.run_number }}/" },
                    { "type": "button", "text": { "type": "plain_text", "text": "🧾 GitHub Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }

      - name: Mark workflow failed if tests failed
        if: steps.result.outputs.outcome != 'success'
        run: exit 1

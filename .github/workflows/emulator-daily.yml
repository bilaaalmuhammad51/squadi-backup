name: Daily Android Emulator Tests

# Tier 1 of the Asma plan:
# Fast, frequent regression on an Android emulator running entirely on the
# GitHub Actions runner (local Appium server + UiAutomator2). No BrowserStack
# minutes are consumed here - runner minutes only.
#
# The suite runs SHARDED: `prepare` splits the spec files into N groups,
# `emulator-test` runs one group per matrix job, and `report` merges every
# shard's allure-results into a single report and one Slack message.
#
# Isolation: each shard is a separate GitHub runner with its own emulator, its
# own Appium server and its own app install, so shards cannot touch each
# other's device state. On the server side each spec that mutates match data
# creates its own match through the API first (MatchApiHelper.createMatch), so
# concurrent shards never edit the same match either.

on:
  schedule:
    # 02:00 PKT daily (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from
        required: true
        default: develop
      api_level:
        description: Android API level for the emulator
        required: true
        default: "34"
      spec_path:
        description: "Spec glob to run (default: all specs)"
        required: false
        default: "tests/specs/**/*.ts"
      shard_total:
        description: "How many emulators to run in parallel (1 = old sequential behaviour)"
        required: false
        default: "6"

permissions:
  contents: write # push the report to the gh-pages branch
  actions: read

# Shared with the BrowserStack workflow so only one publish runs at a time
# (prevents concurrent pushes racing on the gh-pages branch). Only the `report`
# job publishes, so the shards themselves are never serialised by this.
concurrency:
  group: pages-site-publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Work out how many shards to start and hand the matrix the list of indexes.
  # ---------------------------------------------------------------------------
  prepare:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      spec_count: ${{ steps.plan.outputs.spec_count }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Plan the shard matrix
        id: plan
        env:
          SPEC_PATH: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}
          REQUESTED_SHARDS: ${{ github.event.inputs.shard_total || '6' }}
        run: |
          spec_count="$(node scripts/shard-specs.js --count)"
          requested="$REQUESTED_SHARDS"

          # Clamp to [1, spec_count]. More shards than specs would boot
          # emulators with nothing to run - pure wasted runner minutes.
          if ! [ "$requested" -ge 1 ] 2>/dev/null; then requested=1; fi
          if [ "$requested" -gt "$spec_count" ]; then requested="$spec_count"; fi

          shards="$(seq 1 "$requested" | jq -R . | jq -sc .)"
          echo "Splitting $spec_count spec(s) across $requested shard(s): $shards"

          {
            echo "spec_count=$spec_count"
            echo "shard_total=$requested"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # One emulator per shard, all running at the same time.
  # ---------------------------------------------------------------------------
  emulator-test:
    name: Android Emulator (shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard_total }})
    needs: prepare
    runs-on: ubuntu-latest
    # Safety net against a true runaway only - the emulator is force-killed
    # after tests so the job ends promptly on its own. A shard runs roughly
    # 1/N of the suite, so this is far more slack than a shard ever needs.
    timeout-minutes: 120

    strategy:
      # Never cancel the other shards because one of them failed - we want the
      # full picture in the merged report, not a partial one.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}

    env:
      PLATFORM: android
      ENV: local
      APP: Squadi
      TEST_ENV: Dev
      API_LEVEL: ${{ github.event.inputs.api_level || '34' }}
      SPEC_PATH: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.prepare.outputs.shard_total }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Appium UiAutomator2 driver
        # Pin to the 3.x line: driver v4+ requires Appium 3, but this project
        # uses Appium 2 (see package.json). 3.x is the Appium-2-compatible line.
        run: npx appium driver install uiautomator2@3.10.0

      - name: Setup Java (Allure + Android tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The hosted runner ships with ~6.9 GB free, but the pixel_6 profile asks
      # for a 7372.80 MB userdata partition, so the emulator dies at launch with
      # "Not enough space to create userdata partition" and every later adb poll
      # fails until the boot timeout. Dropping the preinstalled toolchains we
      # never use buys back well over 20 GB. df is printed so the margin is
      # visible in the log if this ever gets tight again.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Download test APK
        env:
          # The test APK is stored as an asset on a GitHub Release in this
          # repo (tag below). GITHUB_TOKEN can read it directly - no external
          # service, virus-scan page, or quota to fight with.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_RELEASE_TAG: ${{ vars.APK_RELEASE_TAG || 'test-apk' }}
        run: |
          mkdir -p tests/apps
          gh release download "$APK_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern squadi-dev.apk \
            --dir tests/apps \
            --clobber
          echo "Downloaded APK:"
          ls -la tests/apps/squadi-dev.apk
          # Fail early if we somehow got something that isn't an APK
          if ! file tests/apps/squadi-dev.apk | grep -qiE 'archive|android|zip'; then
            echo "Downloaded file does not look like an APK:"
            file tests/apps/squadi-dev.apk
            head -c 200 tests/apps/squadi-dev.apk
            exit 1
          fi

      - name: Clean old reports
        run: rm -rf allure-results allure-report

      - name: Run tests on Android emulator
        id: run_tests
        continue-on-error: true
        # Step cap for ONE shard. The teardown hang is handled by force-killing
        # the emulator at the end of the script, so this is only a runaway
        # guard - normal shards end well before it.
        timeout-minutes: 110
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          # pixel_6 otherwise defaults to a 7.2 GB userdata partition, which is
          # more than the runner has free. 6 GB is ample for the app plus its
          # data and keeps the AVD under the limit on every runner pool.
          disk-size: 6144M
          # More RAM/cores so the launcher doesn't ANR ("Pixel Launcher isn't
          # responding") under load. -no-snapshot-save avoids a slow snapshot
          # write that can hang teardown.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2
          disable-animations: true
          # The runner executes each line of an inline script as a separate
          # shell, so the full sequence lives in one file instead.
          script: bash scripts/run-emulator-tests.sh

      # allure-results is how this shard's results reach the `report` job -
      # unlike the Appium log this upload is NOT optional, so it is left to
      # fail the shard if it fails. Retention is 1 day because these are
      # consumed by the very next job; the published report is the durable
      # copy and lives on the gh-pages branch, not in artifact storage.
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: |
            allure-results
            wdio-exit-code.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Appium log
        if: always()
        # Non-fatal: if the Actions artifact storage quota is full this upload
        # fails, but it must not fail the run - the report is published to the
        # gh-pages branch (git storage), which does not use artifact storage.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: appium.log
          if-no-files-found: ignore
          # Debug aid only - keep it short so old logs don't accumulate against
          # the shared Actions storage quota (default retention is 90 days).
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Merge every shard's results into one report, publish it, notify Slack once.
  # ---------------------------------------------------------------------------
  report:
    name: Merge results and publish report
    needs: [prepare, emulator-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Get commit short SHA
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download every shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: shard-artifacts

      # Allure result files are uniquely named (uuid-result.json etc.), so the
      # shards' results merge by simply being copied into one directory - there
      # is nothing to reconcile and no chance of one shard overwriting another.
      - name: Merge shard results
        id: merge
        run: |
          rm -rf allure-results allure-report
          mkdir -p allure-results

          shopt -s nullglob
          shard_dirs=(shard-artifacts/allure-results-shard-*)
          echo "Found ${#shard_dirs[@]} shard artifact(s)"

          worst=0
          missing=0
          for dir in "${shard_dirs[@]}"; do
            name="$(basename "$dir")"

            if [ -d "$dir/allure-results" ]; then
              count=$(find "$dir/allure-results" -type f | wc -l)
              echo "  $name -> $count result file(s)"
              cp -r "$dir/allure-results/." allure-results/
            else
              echo "  $name -> NO allure-results (shard produced nothing)"
              missing=$((missing + 1))
            fi

            # Trust each shard's real WDIO exit code, not the emulator-runner
            # step outcome - that step exits non-zero because we hard-kill the
            # emulator, even when the tests passed.
            code="$(cat "$dir/wdio-exit-code.txt" 2>/dev/null || echo 1)"
            echo "     exit code: $code"
            [ "$code" = "0" ] || worst=1
          done

          # A shard that never wrote an exit code at all (runner died, job
          # cancelled, timeout) must not be silently reported as a pass.
          # Empty when `prepare` itself failed - then there is nothing to
          # compare against and the missing artifacts already fail the run.
          expected="${{ needs.prepare.outputs.shard_total }}"
          expected="${expected:-0}"
          if [ "${#shard_dirs[@]}" -ne "$expected" ]; then
            echo "Expected $expected shard artifact(s), got ${#shard_dirs[@]} - marking the run failed"
            worst=1
          fi
          [ "$missing" -eq 0 ] || worst=1

          echo "exit_code=$worst" >> "$GITHUB_OUTPUT"
          echo "Merged $(find allure-results -type f | wc -l) result file(s); overall exit code $worst"

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            npx --no-install allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<h1>No Allure results generated</h1>" > allure-report/index.html
          fi

      - name: Generate test summary
        if: always()
        id: summary
        run: |
          node <<'EOF'
          const fs = require("fs");
          const summaryPath = "allure-report/widgets/summary.json";
          let stat = {}, ms = 0;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            stat = s.statistic || {};
            ms = s.time?.duration || 0;
          }
          const sec = Math.round(ms / 1000);
          const dur = sec >= 60 ? `${Math.floor(sec/60)}m ${sec%60}s` : `${sec}s`;
          const out = process.env.GITHUB_OUTPUT;
          // Count "broken" (tests that errored) as failed so the reported
          // numbers match reality - a broken test is not a pass.
          const failed = (stat.failed || 0) + (stat.broken || 0);
          fs.appendFileSync(out, `total=${stat.total || 0}\n`);
          fs.appendFileSync(out, `passed=${stat.passed || 0}\n`);
          fs.appendFileSync(out, `failed=${failed}\n`);
          fs.appendFileSync(out, `broken=${stat.broken || 0}\n`);
          fs.appendFileSync(out, `flaky=${stat.flaky || 0}\n`);
          fs.appendFileSync(out, `skipped=${stat.skipped || 0}\n`);
          fs.appendFileSync(out, `duration=${dur}\n`);
          EOF

      - name: Determine test result
        if: always()
        id: result
        run: |
          code="${{ steps.merge.outputs.exit_code }}"
          code="${code:-1}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      # Restore the previously published site from the gh-pages BRANCH (git
      # storage) so per-run history is preserved. This does not touch the
      # Actions artifact storage quota. If the branch does not exist yet, this
      # is a no-op and the site starts fresh.
      - name: Checkout existing gh-pages content
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev

      - name: Assemble Pages site (per-run report + 3-day history)
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RETENTION_DAYS: "3"
          PREV_SITE_DIR: gh-pages-prev
        run: bash scripts/assemble-allure-site.sh

      # Publish to the gh-pages branch. Because this commits to a git branch
      # (not an Actions artifact), it succeeds even when the Actions artifact
      # storage quota is full - which is exactly what was breaking the report.
      # The Pages URL is unchanged as long as the repo's Pages source is set to
      # "Deploy from a branch -> gh-pages / (root)".
      - name: Publish report to gh-pages branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # force_orphan keeps gh-pages at a SINGLE commit every run. Without
          # it the branch's git history would grow without bound (a slow-motion
          # repeat of the storage problem) even though old report files are
          # pruned. The assemble step already restored prior reports into
          # _site, so replacing the whole branch loses no history.
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Publish emulator report for run #${{ github.run_number }}"

      - name: Send Slack report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Squadi Daily Emulator Test Result",
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "📱 Squadi Daily Emulator (Android)" } },
                { "type": "section", "text": { "type": "mrkdwn", "text": "${{ steps.result.outputs.outcome == 'success' && '🟢 *PASSED*' || '🔴 *FAILED*' }}" } },
                { "type": "divider" },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*🧪 Total*\n${{ steps.summary.outputs.total }}" },
                    { "type": "mrkdwn", "text": "*⏱ Duration*\n${{ steps.summary.outputs.duration }}" },
                    { "type": "mrkdwn", "text": "*✅ Passed*\n${{ steps.summary.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*❌ Failed*\n${{ steps.summary.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*⏭ Skipped*\n${{ steps.summary.outputs.skipped }}" },
                    { "type": "mrkdwn", "text": "*⚠️ Flaky*\n${{ steps.summary.outputs.flaky }}" }
                  ]
                },
                { "type": "divider" },
                { "type": "context", "elements": [ { "type": "mrkdwn", "text": "💻 Execution: *GitHub Actions emulator (local Appium)*  ·  ⚡ Parallel shards: *${{ needs.prepare.outputs.shard_total }}*  ·  🔑 Commit: `${{ steps.commit.outputs.short_sha }}`" } ] },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "📊 Allure Report" }, "style": "primary", "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/emulator/${{ github.run_number }}/" },
                    { "type": "button", "text": { "type": "plain_text", "text": "🧾 GitHub Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }

      - name: Mark workflow failed if tests failed
        if: steps.result.outputs.outcome != 'success'
        run: exit 1

name: Squadi Mobile Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests from
        required: true
        default: develop
      platform:
        description: Platform
        required: true
        default: android
      environment:
        description: Test environment
        required: true
        default: browserstack
      spec:
        description: WDIO spec path
        required: true
        default: tests/specs/login/test_validate_successful_login_flow.ts

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run mobile tests
    runs-on: ubuntu-latest

    env:
      PLATFORM: ${{ github.event.inputs.platform }}
      ENV: ${{ github.event.inputs.environment }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    outputs:
      test_status: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Get commit short SHA
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean old Allure results
        run: rm -rf allure-results allure-report

      - name: Run WDIO tests on BrowserStack
        id: run_tests
        continue-on-error: true
        run: |
          npx wdio run wdio.conf.ts --spec "${{ github.event.inputs.spec }}"

      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Add report landing page info
        if: always()
        run: |
          cat > allure-report/environment.properties <<EOF
          Repo=${{ github.repository }}
          Branch=${{ github.event.inputs.branch }}
          Commit=${{ github.sha }}
          Platform=${{ github.event.inputs.platform }}
          Environment=${{ github.event.inputs.environment }}
          BrowserStack=true
          GitHub_Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report
          retention-days: 14

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Slack report
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📱 BrowserStack Mobile Test Result",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📱 BrowserStack Mobile Test Result"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ steps.run_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repo:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.event.inputs.branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ steps.commit.outputs.short_sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Platform:*\n${{ github.event.inputs.platform }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ github.event.inputs.environment }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Spec:*\n`${{ github.event.inputs.spec }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open Allure Report"
                      },
                      "style": "primary",
                      "url": "${{ steps.deployment.outputs.page_url }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open GitHub Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open Repo"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}"
                    }
                  ]
                }
              ]
            }

      - name: Mark workflow failed if tests failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1